name: Checks
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
      TEST_DATABASE_URL: ${{ secrets.CI_TEST_DATABASE_URL }}
      TEST_DATABASE_CONFIRM_ISOLATED: ${{ vars.RUN_ISOLATED_E2E }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: ${{ vars.RUN_ISOLATED_E2E == 'true' }}
        run: npm run check:supabase
      - if: ${{ vars.RUN_ISOLATED_E2E == 'true' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ vars.RUN_ISOLATED_E2E == 'true' }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
